[project]
name = "agency-analytics-kit"
version = "1.0.0"
description = "Multi-tenant marketing data pipeline: extract, transform, and visualize ads + organic social metrics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Agency Analytics Kit Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "dlt[postgres]>=1.0",
    "dbt-postgres>=1.8",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Developmi/agency-analytics-kit"
Documentation = "https://github.com/Developmi/agency-analytics-kit#readme"
Repository = "https://github.com/Developmi/agency-analytics-kit"
Issues = "https://github.com/Developmi/agency-analytics-kit/issues"
Changelog = "https://github.com/Developmi/agency-analytics-kit/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agency_analytics"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["src/connectors", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N999"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
