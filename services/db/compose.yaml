services:
  postgres:
    image: postgres:16-alpine
    container_name: agency_postgres
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agency_admin} -d ${POSTGRES_DB:-agency_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agency_internal_net

volumes:
  pgdata:

networks:
  agency_internal_net:
    external: true
