---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned at apply time (actionlint v1.7.12, linux amd64); dependabot updates.
  ACTIONLINT_VERSION: "1.7.12"
  # Public checksum constant; false positive for detect-secrets.
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"  # pragma: allowlist secret

jobs:
  lint:
    name: Lint (ruff, mypy, actionlint, zizmor, hadolint, yamllint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: false

      - name: Sync dependencies (uv sync --frozen)
        run: uv sync --frozen

      - name: Lint (make lint)
        run: make lint

      - name: Format check (make check)
        run: make check

      - name: Typecheck (make typecheck)
        run: make typecheck

      - name: Install actionlint
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp"
          install -m 0755 "$tmp/actionlint" actionlint

      # Run the workspace-relative binary: a quoted "$HOME/..." scalar in YAML
      # only delimits the string, so the executed command would be unquoted and
      # shellcheck (SC2086) would fail the run on CI.
      - name: Run actionlint
        run: ./actionlint

      - name: Audit workflows (zizmor)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx zizmor@1.26.1 .github/workflows

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Lint YAML (yamllint)
        run: uvx yamllint@1.38.0 -c .yamllint.yaml .github/workflows services/*/compose.yaml
