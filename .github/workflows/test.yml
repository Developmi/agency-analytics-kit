---
name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (uv sync --frozen + make test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Sync dependencies (uv sync --frozen)
        run: uv sync --frozen

      - name: Run tests (make test)
        run: make test

  compose-config-no-env:
    name: Compose config without .env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate compose configs with no .env present
        run: |
          set -euo pipefail
          if find . -name .env -not -path './.git/*' | grep -q .; then
            echo "::error::unexpected .env in checkout"
            exit 1
          fi
          validate() { # [--profile NAME] $@ = compose files
            files=()
            profile=()
            if [ "${1:-}" = "--profile" ]; then
              profile=(--profile "$2")
              shift 2
            fi
            for f in "$@"; do files+=(-f "$f"); done
            if ! out="$(docker compose --env-file /dev/null "${profile[@]}" "${files[@]}" config 2>&1)"; then
              echo "::error::compose config failed"
              printf '%s\n' "$out"
              exit 1
            fi
            if printf '%s' "$out" | grep -qE 'variable is not set\. Defaulting to a blank string\.'; then
              echo "::error::compose interpolates an unset required var"
              printf '%s\n' "$out"
              exit 1
            fi
          }
          validate services/db/compose.yaml
          validate services/pipeline/compose.yaml
          # Metabase is profile opt-in (multi-tenancy-real, spec F-R1/F-R3):
          # validate db+metabase in BOTH states, without interpolation warning.
          # F-S1: OFF default - config valid, metabase service ABSENT.
          validate services/db/compose.yaml services/metabase/compose.yaml
          if docker compose --env-file /dev/null -f services/db/compose.yaml -f services/metabase/compose.yaml config --services | grep -qx metabase; then
            echo "::error::metabase must be profile-gated (absent without --profile metabase)"
            exit 1
          fi
          # F-S2: ON with profile - config valid, metabase service PRESENT.
          validate --profile metabase services/db/compose.yaml services/metabase/compose.yaml
          if ! docker compose --env-file /dev/null --profile metabase -f services/db/compose.yaml -f services/metabase/compose.yaml config --services | grep -qx metabase; then
            echo "::error::metabase must be present with --profile metabase"
            exit 1
          fi
