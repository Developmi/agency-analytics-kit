name: agency_dbt
profile: agency
model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
target-path: target   # D4/B4: explícito y regenerable (gitignored, bind-mounted)
log-path: logs        # dbt-core no lee DBT_TARGET_PATH/DBT_LOG_PATH (eran no-ops)

vars:
  client_id: "default"
  client_schema: "public"

models:
  agency_dbt:
    staging:
      +schema: staging
      +materialized: view
      +tags: [staging]
    intermediate:
      +schema: staging
      +materialized: view
      +tags: [intermediate]
    marts:
      +materialized: table
      +tags: [marts]
