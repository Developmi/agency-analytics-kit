version: 2

sources:
  # M1 source routing (design D1, spec B-R2): the raw_* connector schemas below
  # are jinja-rendered per invocation — schema becomes raw_<connector>_<client_id>
  # for the running client (tenant silo: stg_* reads its own raw namespace).
  # The `public` observability source at the bottom stays static: monitoring is
  # shared and client-partitioned by row (client_id), never per-client schema.
  - name: raw_meta
    database: agency_dw
    schema: "raw_meta_{{ var('client_id') }}"
    tables:
      - name: ads
      - name: campaigns

  - name: raw_tiktok
    database: agency_dw
    schema: "raw_tiktok_{{ var('client_id') }}"
    tables:
      - name: ads
      - name: campaigns

  - name: raw_google
    database: agency_dw
    schema: "raw_google_{{ var('client_id') }}"
    tables:
      - name: ads
      - name: campaigns

  - name: raw_facebook
    database: agency_dw
    schema: "raw_facebook_{{ var('client_id') }}"
    tables:
      - name: page_posts
      - name: feed
      - name: page_insights_daily
      - name: page_profile

  - name: raw_instagram
    database: agency_dw
    schema: "raw_instagram_{{ var('client_id') }}"
    tables:
      - name: media
      - name: insights_daily
      - name: insights_totals
      - name: business_profile
      # E (NOM-E1): append-only archive tables owned by the archiver (D) and
      # stored next to the live tables in the same per-tenant schema. They are
      # registered here so the organic marts can merge evicted history with the
      # live serving set. Archiver naming/DDL/captured_at contracts unchanged.
      # The child `__` table keeps its dlt name (insights_totals__breakdowns)
      # and is registered-but-unconsumed in v1 (spec NOM-E-S2).
      - name: insights_totals_history
      - name: insights_totals__breakdowns_history
      - name: follower_count_history

  - name: raw_tiktok_organic
    database: agency_dw
    schema: "raw_tiktok_organic_{{ var('client_id') }}"
    tables:
      - name: profile_stats
      - name: videos_organic
      # E (NOM-E1): append-only archive table (archiver D); registered so
      # organic_tiktok_profile_daily can rebuild the multi-day run series.
      - name: profile_stats_history

  - name: raw_youtube
    database: agency_dw
    schema: "raw_youtube_{{ var('client_id') }}"
    tables:
      - name: channel_stats
      - name: uploaded_videos
      - name: videos
      - name: video_daily_analytics
      - name: video_analytics
      - name: traffic_source_analytics
      - name: device_analytics
      - name: country_analytics
      - name: playlists
      - name: playlist_items
      - name: comment_threads
      - name: channel_sections
      - name: video_categories
      - name: captions

  - name: raw_pinterest
    database: agency_dw
    schema: "raw_pinterest_{{ var('client_id') }}"
    tables:
      - name: boards
      - name: pins
      - name: board_insights

  - name: raw_ga4
    database: agency_dw
    schema: "raw_ga4_{{ var('client_id') }}"
    tables:
      - name: daily_stats
      - name: page_analytics
      - name: event_analytics

  - name: raw_gtm
    database: agency_dw
    schema: "raw_gtm_{{ var('client_id') }}"
    tables:
      - name: containers
      - name: tags
      - name: triggers

  # ===== OBSERVABILITY =====

  - name: public
    database: agency_dw
    schema: public
    tables:
      - name: pipeline_runs
      - name: pipeline_run_steps
